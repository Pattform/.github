name: Pattform deploy

# Reusable deploy workflow for every Pattform app repo (ADR-001). App repos
# call it with a few lines (see README.md) and hold only YAML specs in
# deploy/; all logic lives in @pattform/engine and the capabilities it
# installs.
#
#   pull_request  validate, then preview every spec
#   push to main  validate, then up every spec (Client specs first)
#   schedule      drift check; fails the run if anything drifted
#
# Credentials are keyless: GitHub's OIDC token assumes pattform-github-deploy
# in AWS and impersonates pattform-infra in GCP via the github-actions pool.
on:
  workflow_call:
    inputs:
      engine-version:
        description: "@pattform/engine version to run"
        type: string
        default: "0.1.0"

env:
  AWS_REGION: ap-southeast-2
  SOPS_VERSION: "3.13.3"
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

jobs:
  validate:
    # Schemas and secret keys only: no cloud credentials, safe on any PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npx --yes "@pattform/engine@${{ inputs.engine-version }}" validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One run at a time per repo; never cancel an in-flight `up`.
    concurrency:
      group: pattform-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install sops
        run: |
          curl -sSfL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops
      - name: Install Pulumi
        uses: pulumi/actions@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134451374:role/pattform-github-deploy
          aws-region: ap-southeast-2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/408361654923/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: pattform-infra@pattform-management.iam.gserviceaccount.com
      - name: Run pattform
        run: |
          case "${{ github.event_name }}" in
            pull_request) command=preview ;;
            schedule)     command=drift ;;
            *)            command=up ;;
          esac
          npx --yes "@pattform/engine@${{ inputs.engine-version }}" "$command"
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattform-status
          path: .pattform/status.json
          if-no-files-found: ignore

